[package]
name = "lint-my-headers"
version = "0.6.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Agent-ready license-header linting for Python, JavaScript, TypeScript, Rust, Go, Swift, and Bash/shell"
repository = "https://github.com/frgfm/lint-my-headers"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "lmh"
path = "rust/main.rs"

[[bin]]
name = "lint-my-headers"
path = "rust/long_main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
rustpython-parser = { version = "0.4", default-features = false, features = ["full-lexer", "num-bigint"] }
tempfile = "3"
sha2 = "0.10"
pathdiff = "0.2"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-swift = "0.7.3"
tree-sitter-bash = "0.25.1"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.release]
strip = true
lto = "thin"
