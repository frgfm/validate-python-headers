name: documentation

on:
  push:
    branches: [main]
    paths: &paths [docs/**, zensical.toml, wrangler.toml, pyproject.toml, uv.lock, Makefile,
      .github/prepare_docs_assets.sh, .github/prepare_docs_fonts.sh, .github/workflows/docs.yml]
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.12.5"
  WRANGLER_VERSION: "4.147.0"
  WRANGLER_SEND_METRICS: "false"

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build documentation
        run: make docs-cloudflare
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Validate Wrangler configuration without deploying
        run: npx --yes wrangler@"$WRANGLER_VERSION" deploy --dry-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: .docs-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
