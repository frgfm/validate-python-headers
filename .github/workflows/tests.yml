name: tests

on:
  push:
    branches: main
  pull_request:
    branches: main

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.12.5"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONOPTIMIZE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and contract tests
        run: python -m unittest discover -s src/tests -v

  platform-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      PYTHONOPTIMIZE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run Python 3.14 CLI and path tests
        run: python -m unittest discover -s src/tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build and smoke-test distributions
        run: make package-check

  run-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check repository headers from configuration
        uses: ./
      - name: Prepare integration fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          notice = (
              "# This program is licensed under the Apache License 2.0.\n"
              "# See LICENSE or go to <https://www.apache.org/licenses/LICENSE-2.0> for full license details.\n"
          )

          def write(path, owner):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(f"# Copyright (C) 2024, {owner}.\n\n{notice}\nvalue = 1\n", encoding="utf-8")

          write(".action-test/success/stale.py", "François-Guillaume Fernandez")
          write(".action-test/mixed/safe.py", "François-Guillaume Fernandez")
          write(".action-test/mixed/bad.py", "Another Owner")
          PY
      - name: Fix a stale header
        id: fix
        uses: ./
        with:
          mode: fix
          license: 'Apache-2.0'
          owner: 'François-Guillaume Fernandez'
          starting-year: 2022
          folders: '.action-test/success'
          ignore-files: ''
          ignore-folders: ''
      - name: Save and verify first fix
        shell: bash
        env:
          CHANGED: ${{ steps.fix.outputs.changed }}
          ISSUES: ${{ steps.fix.outputs.issues }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if json.loads(os.environ["ISSUES"]) != []:
              raise RuntimeError("fix left unresolved issues")
          if json.loads(os.environ["CHANGED"]) != [".action-test/success/stale.py"]:
              raise RuntimeError("fix changed output is incorrect")
          source = Path(".action-test/success/stale.py")
          Path(os.environ["RUNNER_TEMP"], "fixed.py").write_bytes(source.read_bytes())
          PY
      - name: Run fix a second time
        id: second-fix
        uses: ./
        with:
          mode: fix
          license: 'Apache-2.0'
          owner: 'François-Guillaume Fernandez'
          starting-year: 2022
          folders: '.action-test/success'
          ignore-files: ''
          ignore-folders: ''
      - name: Verify idempotence
        shell: bash
        env:
          CHANGED: ${{ steps.second-fix.outputs.changed }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          source = Path(".action-test/success/stale.py")
          if json.loads(os.environ["CHANGED"]) != []:
              raise RuntimeError("second fix was not idempotent")
          if source.read_bytes() != Path(os.environ["RUNNER_TEMP"], "fixed.py").read_bytes():
              raise RuntimeError("second fix changed bytes")
          if f"Copyright (C) 2024-{datetime.now().year}" not in source.read_text(encoding="utf-8"):
              raise RuntimeError("year was not updated")
          PY
      - name: Fix safe files and fail on ambiguity
        id: mixed
        continue-on-error: true
        uses: ./
        with:
          mode: fix
          license: 'Apache-2.0'
          owner: 'François-Guillaume Fernandez'
          starting-year: 2022
          folders: '.action-test/mixed'
          ignore-files: ''
          ignore-folders: ''
      - name: Verify fail-closed repair
        shell: bash
        env:
          CHANGED: ${{ steps.mixed.outputs.changed }}
          ISSUES: ${{ steps.mixed.outputs.issues }}
          OUTCOME: ${{ steps.mixed.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          if os.environ["OUTCOME"] != "failure":
              raise RuntimeError("ambiguous file did not fail the Action")
          if json.loads(os.environ["ISSUES"]) != [".action-test/mixed/bad.py"]:
              raise RuntimeError("issues output is incorrect")
          if json.loads(os.environ["CHANGED"]) != [".action-test/mixed/safe.py"]:
              raise RuntimeError("changed output is incorrect")
          if f"Copyright (C) 2024-{datetime.now().year}" not in Path(
              ".action-test/mixed/safe.py"
          ).read_text(encoding="utf-8"):
              raise RuntimeError("safe file was not repaired")
          if "Another Owner" not in Path(".action-test/mixed/bad.py").read_text(encoding="utf-8"):
              raise RuntimeError("ambiguous file was changed")
          PY
      - name: Verify tracked files are unchanged
        run: git diff --exit-code

  deps-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run generated-data and dependency checks
        run: make deps-check

  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check repository headers
        uses: ./
        with:
          license: 'Apache-2.0'
          owner: 'François-Guillaume Fernandez'
          starting-year: 2022
          folders: 'src,.github,scripts'
          ignore-files: 'version.py,__init__.py,collect_env.py'
          ignore-folders: ''
