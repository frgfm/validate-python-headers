name: publish release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

env:
  RELEASE_UV_VERSION: "0.12.5"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: ${{ env.RELEASE_UV_VERSION }}
      - name: Verify tag and package versions
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(uv version --short)"
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run optimized-mode unit tests
        env:
          PYTHONOPTIMIZE: "1"
        run: python -m unittest discover -s src/tests -v
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Smoke-test wheel
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: uv run --isolated --no-project --with dist/*.whl .github/smoke_distribution.py
      - name: Smoke-test source distribution
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: uv run --isolated --no-project --with dist/*.tar.gz .github/smoke_distribution.py
      - name: Retain exact release artifacts and publishing checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          if-no-files-found: error
          path: |
            dist/
            .github/pypi_release.py

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/validate-python-headers
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: ${{ env.RELEASE_UV_VERSION }}
      - name: Download reviewed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - name: Publish only missing byte-identical artifacts
        run: >-
          python .github/pypi_release.py publish dist
          --version "${{ needs.build.outputs.version }}"

  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: ${{ env.RELEASE_UV_VERSION }}
      - name: Download reviewed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .
      - name: Verify live PyPI filenames and hashes
        run: >-
          python .github/pypi_release.py verify dist
          --version "${{ needs.build.outputs.version }}"
      - name: Verify a clean live installation
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          actual="$(uvx --refresh-package validate-python-headers --from "validate-python-headers==$VERSION" vph --version)"
          if [[ "$actual" != "vph $VERSION" ]]; then
            echo "Unexpected installed version: $actual" >&2
            exit 1
          fi

  github-release:
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          args=(release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$VERSION" == *rc* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
