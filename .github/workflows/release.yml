name: publish release

on:
  release:
    types: [published]

env:
  RELEASE_UV_VERSION: "0.12.5"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: ${{ env.RELEASE_UV_VERSION }}
      - name: Verify tag and package versions
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          package_version="$(uv version --short)"
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $package_version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run optimized-mode unit tests
        env:
          PYTHONOPTIMIZE: "1"
        run: python -m unittest discover -s src/tests -v
      - name: Build and smoke-test distributions
        run: make package-check
      - name: Retain exact release artifacts and publishing checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/
            .github/pypi_release.py

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lint-my-headers
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: ${{ env.RELEASE_UV_VERSION }}
      - name: Download reviewed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - name: Publish only missing byte-identical artifacts
        run: >-
          python .github/pypi_release.py publish dist
          --version "${{ needs.build.outputs.version }}"

  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: ${{ env.RELEASE_UV_VERSION }}
      - name: Download reviewed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .
      - name: Verify live PyPI filenames and hashes
        run: >-
          python .github/pypi_release.py verify dist
          --version "${{ needs.build.outputs.version }}"
      - name: Verify a clean live installation
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          actual="$(uvx --refresh-package lint-my-headers --from "lint-my-headers==$VERSION" lmh --version)"
          if [[ "$actual" != "lmh $VERSION" ]]; then
            echo "Unexpected installed version: $actual" >&2
            exit 1
          fi
